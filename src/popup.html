<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main id="main-view" class="view">
    <header class="header">
      <img class="header__icon" src="../icons/icon48.png" alt="" width="28" height="28">
      <h1 id="extension-name"></h1>
    </header>

    <section class="hero" aria-live="polite">
      <p id="preview-source" class="hero__source"></p>
      <p id="preview-prices" class="hero__prices"></p>
      <p id="preview-date" class="hero__date"></p>
    </section>

    <section class="section">
      <h2 class="section__title">
        <span data-i18n="popupCurrencies">Currencies</span>
        <span class="section__hint" data-i18n="popupReorderHint">Drag to reorder</span>
      </h2>
      <ul id="currencies" class="rows"></ul>
    </section>

    <button id="add" class="add" type="button">
      <span class="add__plus" aria-hidden="true">+</span>
      <span data-i18n="popupAdd">Add currency</span>
    </button>
  </main>

  <section id="picker-view" class="view" hidden>
    <header class="picker__head">
      <button id="back" class="icon-button" type="button" aria-label="Back" data-i18n-label="popupBack">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <input id="search" class="search" type="search" autocomplete="off" spellcheck="false"
             placeholder="Search currencies" data-i18n-placeholder="popupSearch">
    </header>
    <ul id="picker-list" class="picks"></ul>
    <p id="picker-empty" class="picker__empty" data-i18n="popupNoMatch" hidden>Nothing found</p>
  </section>

  <p id="status" class="status" role="status" aria-live="polite"></p>

  <script type="module" src="popup.js"></script>
</body>
</html>
